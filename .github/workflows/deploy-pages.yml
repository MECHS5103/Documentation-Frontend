name: Deploy GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: production-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_APPS_SCRIPT_URL: ${{ vars.EXPO_PUBLIC_APPS_SCRIPT_URL }}
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ vars.EXPO_PUBLIC_FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
      EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      EXPO_PUBLIC_FIREBASE_APP_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_APP_ID }}
      EXPO_PUBLIC_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ vars.EXPO_PUBLIC_RECAPTCHA_ENTERPRISE_SITE_KEY }}
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run verification
        run: |
          npm run test:apps-script
          npm run test:storage-rules

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Build the immutable artifact
        run: |
          test -n "$EXPO_PUBLIC_APPS_SCRIPT_URL"
          test -n "$EXPO_PUBLIC_FIREBASE_API_KEY"
          test -n "$EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN"
          test -n "$EXPO_PUBLIC_FIREBASE_PROJECT_ID"
          test -n "$EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET"
          test -n "$EXPO_PUBLIC_FIREBASE_APP_ID"
          test -n "$EXPO_PUBLIC_RECAPTCHA_ENTERPRISE_SITE_KEY"
          npm run build:web

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the reviewed artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
