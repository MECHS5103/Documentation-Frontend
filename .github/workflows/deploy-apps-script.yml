name: Deploy Apps Script

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-apps-script
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production-apps-script
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Test Apps Script
        run: npm run test:apps-script

      - name: Configure clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.APPS_SCRIPT_CLASPRC_JSON }}
          SCRIPT_ID: ${{ secrets.APPS_SCRIPT_SCRIPT_ID }}
        run: |
          test -n "$CLASPRC_JSON"
          test -n "$SCRIPT_ID"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$SCRIPT_ID" > apps-script/.clasp.json

      - name: Push source and create an immutable version
        id: version
        working-directory: apps-script
        run: |
          npx --yes @google/clasp@3.4.1 push --force
          VERSION_OUTPUT=$(npx --yes @google/clasp@3.4.1 version "Source $GITHUB_SHA")
          printf '%s\n' "$VERSION_OUTPUT"
          VERSION_NUMBER=$(printf '%s\n' "$VERSION_OUTPUT" | grep -Eo '[0-9]+' | tail -1)
          test -n "$VERSION_NUMBER"
          echo "number=$VERSION_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Update the production deployment
        working-directory: apps-script
        env:
          DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
          VERSION_NUMBER: ${{ steps.version.outputs.number }}
        run: |
          test -n "$DEPLOYMENT_ID"
          npx --yes @google/clasp@3.4.1 deploy \
            --deploymentId "$DEPLOYMENT_ID" \
            --versionNumber "$VERSION_NUMBER" \
            --description "Source $GITHUB_SHA"
          printf 'Apps Script version %s deployed from `%s`.\n' \
            "$VERSION_NUMBER" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
