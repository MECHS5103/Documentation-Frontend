<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Robotics Documentation - Redirecting...</title>
    
    <!-- Import Chewy Font to match your theme -->
    <link href="https://fonts.googleapis.com/css2?family=Chewy&display=swap" rel="stylesheet">
    
    <style>
      body {
        background-color: #CBD5E1;
        font-family: 'Chewy', cursive, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        color: #1A202C;
      }
      .card {
        background: #FFFFFF;
        padding: 30px 40px;
        border-radius: 14px;
        border: 3px solid #1A202C;
        border-bottom-width: 5px;
        text-align: center;
        box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        max-width: 400px;
      }
      h1 {
        font-size: 28px;
        margin-bottom: 10px;
        color: #207ADB;
      }
      p {
        font-size: 16px;
        color: #4A5568;
        font-family: sans-serif;
      }
      .spinner {
        margin: 20px auto 0 auto;
        width: 32px;
        height: 32px;
        border: 4px solid #EDF2F7;
        border-top: 4px solid #207ADB;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>

    <!-- GitHub Pages SPA Redirect Script -->
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // This script takes the current URL path and redirects it into a query parameter
      // so the React app can pick it up and route to the correct page seamlessly.
      var segmentCount = 1; // Set to 1 because your repo name is /Documentation/
      var l = window.location;
      
      var pathSegments = l.pathname.split('/').slice(1);
      var repoSegment = pathSegments.slice(0, segmentCount).join('/');
      var targetPath = '/' + pathSegments.slice(segmentCount).join('/');

      if (targetPath !== '/' && targetPath !== '') {
        var redirectUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + 
                          '/' + repoSegment + '/?p=' + encodeURIComponent(targetPath) + l.hash;
        window.history.replaceState(null, null, redirectUrl);
        l.replace(redirectUrl);
      }
    </script>
  </head>
  <body>
    <div class="card">
      <h1>Finding your page...</h1>
      <p>Teleoperating you to the right documentation slot!</p>
      <div class="spinner"></div>
    </div>
  </body>
</html>
